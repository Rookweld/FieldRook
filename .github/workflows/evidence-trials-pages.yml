name: Evidence Trials / GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "scripts/evidence_trials/**"
      - "docs/evidence-trials/**"
      - ".github/workflows/evidence-trials-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-trials-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FieldRook backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run fixture-only diagnostic gauntlet
        shell: pwsh
        env:
          MODEL_API_KEY: ""
          FIELDROOK_FIXTURES: always
          FIELDROOK_OFFLINE: "1"
        run: |
          Push-Location backend
          python -m eval.run --results-dir ../.evidence-ci
          if ($LASTEXITCODE -ne 0) { throw "Fixture gauntlet failed" }
          Pop-Location
      - name: Export and validate public synthetic evidence
        shell: pwsh
        env:
          MODEL_API_KEY: ""
          FIELDROOK_FIXTURES: always
          FIELDROOK_OFFLINE: "1"
        run: |
          $run = Get-ChildItem .evidence-ci\*.json | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $run) { throw "Missing gauntlet evidence" }
          python scripts/evidence_trials/export.py --gauntlet $run.FullName
          if ($LASTEXITCODE -ne 0) { throw "Evidence export failed" }
          python scripts/evidence_trials/check.py
          if ($LASTEXITCODE -ne 0) { throw "Public evidence validation failed" }
          node --check docs/evidence-trials/app.js
          if ($LASTEXITCODE -ne 0) { throw "Client JS syntax invalid" }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/evidence-trials

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Evidence Trials
        id: deployment
        uses: actions/deploy-pages@v4
